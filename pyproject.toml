[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tasky"
version = "0.1.0"
description = "A small, human-readable command-line task manager."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tasky contributors" }]
keywords = ["todo", "task", "cli", "productivity", "todo.txt"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
tasky = "tasky.cli:main"

[project.urls]
Homepage = "https://example.com/tasky"

[tool.setuptools.packages.find]
include = ["tasky*"]

[tool.setuptools]
license-files = []
